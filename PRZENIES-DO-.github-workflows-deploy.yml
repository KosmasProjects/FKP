name: Deploy

on:
  push:
    branches: [main]
  # Co 6 godzin przebudowuje stronę, żeby odświeżyć posty z Facebooka.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Pobiera posty do public/facebook-posts.json. Bez sekretów (lub przy błędzie API)
      # krok jest pomijany, a blog pokazuje zapasową wtyczkę Facebooka.
      - name: Pobierz posty z Facebooka
        run: npm run fb
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      - run: npm run build

      # Publikuje dist/ na gałąź gh-pages (tak jak dotychczas).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
